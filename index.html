<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя школа — Журнал (ПК)</title>
    <style>
        :root {
            --bg-main: #f4f7fb;
            --text-main: #0b1f33;
            --text-gray: #66727f;
            --blue-gradient: linear-gradient(270deg, #28bbfa, #0856cc);
            --shadow: 0 2px 12px rgba(12, 41, 117, 0.08);
            --radius: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); }
        
        /* Шапка */
        .header { background: #fff; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 4px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 10; }
        .logo-title { font-size: 22px; font-weight: 800; color: #0b1f33; }
        .user-name { font-size: 14px; font-weight: 600; color: #0e69d5; cursor: pointer; }

        /* Контейнер */
        .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
        .page-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; color: #0b1f33; }

        /* Навигация */
        .top-nav { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid #eef2f7; padding-bottom: 12px; }
        .nav-btn { padding: 8px 16px; border-radius: 8px; border: none; background: transparent; font-size: 15px; font-weight: 500; color: var(--text-gray); cursor: pointer; transition: 0.2s; }
        .nav-btn:hover { background: #eef2f7; }
        .nav-btn.active { background: var(--blue-gradient); color: #fff; box-shadow: 0 4px 10px rgba(8, 86, 204, 0.2); }

        /* Карточки */
        .card { background: #fff; border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); margin-bottom: 20px; }

        /* Панель управления */
        .controls-row { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
        .controls-row select, .controls-row input { padding: 8px 12px; border: 1px solid #d0d7e2; border-radius: 6px; font-size: 14px; outline: none; }
        .controls-row label { font-size: 14px; font-weight: 500; color: var(--text-gray); }
        .btn-lottery { background: linear-gradient(135deg, #ff9800, #f57c00); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .btn-reset { background: #fde8eb; color: #ee3f58; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; }

        /* Кнопки дат */
        .dates-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; }
        .date-btn { padding: 6px 12px; border-radius: 6px; border: 1px solid #d0d7e2; background: #fff; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
        .date-btn.active { background: #0e69d5; color: #fff; border-color: #0e69d5; }

        /* Прогресс-бар */
        .class-avg-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; background: #f9f9f9; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 600; }
        .progress-bg { flex: 1; height: 10px; background: #eef2f7; border-radius: 5px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #28bbfa, #0856cc); border-radius: 5px; transition: width 0.3s; }

        /* Таблица (ПК) */
        .table-wrapper { width: 100%; overflow-x: auto; background: #fff; border: 1px solid #d0d7e2; border-radius: 8px; }
        .excel-table { width: 100%; border-collapse: collapse; font-family: Arial, sans-serif; }
        
        .excel-table th, .excel-table td { 
            border: 1px solid #d0d7e2; 
            text-align: center; 
            padding: 0; 
            height: 40px; 
            background: #e2efda; 
            font-size: 12px; 
        }
        .excel-table th { background: #d9ead3; font-weight: 600; padding: 8px 4px; white-space: nowrap; font-size: 12px; position: sticky; top: 0; z-index: 2; }
        
        /* Колонка с именами */
        .excel-table td.student-name, .excel-table th.student-name { 
            position: sticky; 
            left: 0; 
            background: #d9ead3; 
            font-weight: 700; 
            text-align: left; 
            padding-left: 12px; 
            min-width: 180px; 
            max-width: 180px; 
            z-index: 3; 
            border-right: 2px solid #a0a0a0;
        }
        
        /* Колонка среднего балла */
        .excel-table th.avg-col, .excel-table td.avg-col { 
            background: #f4f4f4; 
            font-weight: bold; 
            width: 60px; 
            min-width: 60px; 
            font-size: 14px; 
            color: #0e69d5; 
            border-left: 2px solid #a0a0a0; 
        }

        /* Ячейка с оценкой */
        .excel-table td { position: relative; }
        .excel-input { width: 100%; height: 40px; border: none; text-align: center; font-size: 15px; font-weight: bold; background: transparent; outline: none; padding: 0; }
        .excel-input:focus { background: #fff; box-shadow: inset 0 0 0 2px #2f8dfc; }
        
        /* Вес оценки */
        .weight-badge { position: absolute; top: 0; right: 0; background: #ff9800; color: #fff; font-size: 9px; border-radius: 50%; width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        
        /* Подсветка лотереи */
        .lottery-highlight { background: #fff3cd !important; transition: 0.3s; }

        /* Стили для контента */
        .empty-state { text-align: center; color: var(--text-gray); padding: 40px 0; font-size: 15px; }
        
        /* Формы */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        .field { display: flex; flex-direction: column; gap: 6px; }
        .field label { font-size: 13px; color: var(--text-gray); font-weight: 500; }
        .field input, .field select { padding: 10px; border: 1px solid #d0d7e2; border-radius: 6px; font-size: 14px; }
        .btn-submit { background: var(--blue-gradient); color: #fff; border: none; padding: 12px; border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 8px; }

        /* Экспорт/Импорт */
        .export-area { background: #eef2f7; padding: 16px; border-radius: 8px; margin-top: 16px; }
        .export-area h3 { font-size: 15px; margin-bottom: 8px; }
        .export-area input[type="file"] { margin-top: 8px; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo-title">МОЯ ШКОЛА • ПК</div>
        <div class="user-name" id="header-user"></div>
    </header>

    <main class="container" id="app"></main>

    <!-- Экран Авторизации -->
    <div id="auth-screen" class="auth-overlay hidden" style="position:fixed; inset:0; background:#f4f7fb; display:flex; align-items:center; justify-content:center; z-index:200;">
        <div class="card" style="width:100%; max-width:400px; padding:32px;">
            <h2 class="page-title" style="text-align:center;">Вход в систему</h2>
            <form onsubmit="handleAuth(event)">
                <div class="field"><label>Логин</label><input type="text" id="auth-login" required placeholder="student1 или teacher"></div>
                <div class="field"><label>Пароль</label><input type="password" id="auth-password" required placeholder="****"></div>
                <button type="submit" class="btn-submit">Войти</button>
            </form>
            <div style="font-size: 12px; color: #888; text-align: center; margin-top: 16px;">
                Учитель: <b>teacher / teacher</b><br>
                Ученик: <b>student1 / student1</b>
            </div>
        </div>
    </div>

<script>
    // --- БАЗА ДАННЫХ ---
    const defaultDB = {
        users: [
            { id: 'u1', login: 'admin', pass: 'admin', role: 'admin', name: 'Администратор', className: '' },
            { id: 'u2', login: 'teacher', pass: 'teacher', role: 'teacher', name: 'Учитель', className: '' },
            { id: 'u3', login: 'student1', pass: 'student1', role: 'student', name: 'Антон', className: '3 «В» класс' },
            { id: 'u4', login: 'student2', pass: 'student2', role: 'student', name: 'Алексей', className: '3 «В» класс' },
            { id: 'u5', login: 'student3', pass: 'student3', role: 'student', name: 'Анастасия', className: '3 «В» класс' },
            { id: 'u6', login: 'student4', pass: 'student4', role: 'student', name: 'Андрей', className: '3 «В» класс' },
            { id: 'u7', login: 'student5', pass: 'student5', role: 'student', name: 'Анна', className: '3 «В» класс' },
            { id: 'u8', login: 'student6', pass: 'student6', role: 'student', name: 'Борис', className: '3 «В» класс' },
            { id: 'u9', login: 'student7', pass: 'student7', role: 'student', name: 'Виктория', className: '3 «В» класс' },
            { id: 'u10', login: 'student8', pass: 'student8', role: 'student', name: 'Владислав', className: '3 «В» класс' },
            { id: 'u11', login: 'student9', pass: 'student9', role: 'student', name: 'Дарья', className: '3 «В» класс' },
            { id: 'u12', login: 'student10', pass: 'student10', role: 'student', name: 'Денис', className: '3 «В» класс' },
            { id: 'u13', login: 'student11', pass: 'student11', role: 'student', name: 'Дмитрий', className: '3 «В» класс' },
            { id: 'u14', login: 'student12', pass: 'student12', role: 'student', name: 'Егор', className: '3 «В» класс' },
            { id: 'u15', login: 'student13', pass: 'student13', role: 'student', name: 'Екатерина', className: '3 «В» класс' },
            { id: 'u16', login: 'student14', pass: 'student14', role: 'student', name: 'Елена', className: '3 «В» класс' },
            { id: 'u17', login: 'student15', pass: 'student15', role: 'student', name: 'Иван', className: '3 «В» класс' },
            { id: 'u18', login: 'student16', pass: 'student16', role: 'student', name: 'Игорь', className: '3 «В» класс' },
            { id: 'u19', login: 'student17', pass: 'student17', role: 'student', name: 'Ирина', className: '3 «В» класс' },
            { id: 'u20', login: 'student18', pass: 'student18', role: 'student', name: 'Кирилл', className: '3 «В» класс' },
            { id: 'u21', login: 'student19', pass: 'student19', role: 'student', name: 'Ксения', className: '3 «В» класс' },
            { id: 'u22', login: 'student20', pass: 'student20', role: 'student', name: 'Максим', className: '3 «В» класс' },
            { id: 'u23', login: 'student21', pass: 'student21', role: 'student', name: 'Маргарита', className: '3 «В» класс' },
            { id: 'u24', login: 'student22', pass: 'student22', role: 'student', name: 'Михаил', className: '3 «В» класс' },
            { id: 'u25', login: 'student23', pass: 'student23', role: 'student', name: 'Наталья', className: '3 «В» класс' },
            { id: 'u26', login: 'student24', pass: 'student24', role: 'student', name: 'Никита', className: '3 «В» класс' },
            { id: 'u27', login: 'student25', pass: 'student25', role: 'student', name: 'Ольга', className: '3 «В» класс' }
        ],
        lessons: [],
        homework: [],
        marks: [] 
    };

    let db = JSON.parse(localStorage.getItem('school_db_v21')) || defaultDB;
    let user = JSON.parse(localStorage.getItem('school_user')) || null;
    
    let currentTab = 'journal';
    let selectedDate = getToday();
    let journalSubject = 'Русский язык';
    let journalDate = getToday();
    let lotteryStudentId = null;

    const SUBJECTS_LIST = ['Русский язык', 'Математика', 'Литер. чтение', 'Окруж. мир', 'ИЗО', 'Труд(технология)', 'Физкультура', 'Англ. яз.', 'Музыка'];

    function getWorkTypes(subject) {
        if (subject === 'Русский язык') return ['Соч.', 'Изл.', 'Дикт.', 'К/Р', 'С/Р', 'Пров.', 'Сл/Д', 'Отв.'];
        if (subject === 'Математика') return ['К/Р', 'С/Р', 'К/С', 'Отв.', 'Раб.', 'Вх.К/Р', 'Итог.', 'Прав.'];
        if (subject === 'Литер. чтение') return ['Отв.', 'Чт.', 'Пер.', 'Тест', 'Д/З'];
        if (subject === 'Окруж. мир') return ['Отв.', 'Тест', 'Пр.', 'Докл.', 'Д/З'];
        return ['Отв.', 'Пр.', 'Тест', 'Д/З'];
    }

    function getToday() {
        const d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }
    function saveDB() { localStorage.setItem('school_db_v21', JSON.stringify(db)); }
    function saveUser(u) { user = u; localStorage.setItem('school_user', JSON.stringify(u)); }
    function logout() { localStorage.removeItem('school_user'); user = null; render(); }
    function uid() { return Math.random().toString(36).substr(2, 9); }

    function formatDate(isoDate) {
        const today = getToday();
        const d = new Date(isoDate);
        const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
        if (isoDate === today) return `Сегодня, ${d.getDate()} ${months[d.getMonth()]}`;
        return `${d.getDate()} ${months[d.getMonth()]}`;
    }

    function handleAuth(e) {
        e.preventDefault();
        const login = document.getElementById('auth-login').value;
        const pass = document.getElementById('auth-password').value;
        const u = db.users.find(u => u.login === login && u.pass === pass);
        if (!u) return alert('Неверный логин или пароль');
        saveUser(u);
        render();
    }

    // --- ЭКСПОРТ/ИМПОРТ ---
    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
        const downloadAnchorNode = document.createElement('a');
        downloadAnchorNode.setAttribute("href", dataStr);
        downloadAnchorNode.setAttribute("download", "school_data.json");
        document.body.appendChild(downloadAnchorNode);
        downloadAnchorNode.click();
        downloadAnchorNode.remove();
        alert('Файл скачан! Отправьте его на телефон.');
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const imported = JSON.parse(e.target.result);
                if (imported.users && imported.marks) {
                    db = imported;
                    saveDB();
                    alert('База обновлена!');
                    render();
                } else { alert('Ошибка файла.'); }
            } catch(err) { alert('Ошибка чтения.'); }
        };
        reader.readAsText(file);
    }

    // --- РЕНДЕР ---
    function render() {
        const authScreen = document.getElementById('auth-screen');
        const headerUser = document.getElementById('header-user');
        const app = document.getElementById('app');

        if (!user) {
            authScreen.classList.remove('hidden');
            headerUser.innerHTML = '';
            app.innerHTML = '';
            return;
        }

        authScreen.classList.add('hidden');
        headerUser.innerHTML = `<span onclick="switchTab('profile')">${user.name} 👤</span>`;

        let navHtml = '';
        if (user.role === 'teacher' || user.role === 'admin') {
            navHtml = `
                <button class="nav-btn ${currentTab==='journal'?'active':''}" onclick="switchTab('journal')">Журнал</button>
                <button class="nav-btn ${currentTab==='schedule'?'active':''}" onclick="switchTab('schedule')">Расписание</button>
                <button class="nav-btn ${currentTab==='hw'?'active':''}" onclick="switchTab('hw')">Домашние задания</button>
            `;
        } else {
            navHtml = `
                <button class="nav-btn ${currentTab==='feed'?'active':''}" onclick="switchTab('feed')">Лента</button>
                <button class="nav-btn ${currentTab==='schedule'?'active':''}" onclick="switchTab('schedule')">Расписание</button>
                <button class="nav-btn ${currentTab==='homework'?'active':''}" onclick="switchTab('homework')">Задания</button>
                <button class="nav-btn ${currentTab==='marks'?'active':''}" onclick="switchTab('marks')">Оценки</button>
                <button class="nav-btn ${currentTab==='final'?'active':''}" onclick="switchTab('final')">Итоговые</button>
            `;
        }

        let contentHtml = '';
        if (currentTab === 'journal') contentHtml = renderJournal();
        else if (currentTab === 'schedule') contentHtml = renderSchedule();
        else if (currentTab === 'hw') contentHtml = renderTeacherHW();
        else if (currentTab === 'homework') contentHtml = renderStudentHW();
        else if (currentTab === 'feed') contentHtml = renderFeed();
        else if (currentTab === 'marks') contentHtml = renderMarks();
        else if (currentTab === 'final') contentHtml = renderFinal();
        else if (currentTab === 'profile') contentHtml = renderProfile();

        app.innerHTML = `
            <div class="top-nav">${navHtml}</div>
            ${contentHtml}
        `;
    }

    function switchTab(tab) { currentTab = tab; render(); }

    // --- ЖУРНАЛ (УЧИТЕЛЬ) ---
    function renderJournal() {
        const students = db.users.filter(u => u.role === 'student');
        const workTypes = getWorkTypes(journalSubject);
        
        const current = new Date(journalDate);
        let dates = [];
        for(let i=-2; i<=2; i++) {
            let d = new Date(current);
            d.setDate(current.getDate() + i);
            dates.push({
                iso: d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'),
                label: d.getDate() + '.' + String(d.getMonth()+1).padStart(2,'0')
            });
        }

        let totalSum = 0, totalCount = 0;
        students.forEach(s => {
            const marks = db.marks.filter(m => m.studentId === s.id && m.subject === journalSubject);
            marks.forEach(m => {
                const v = parseFloat(m.value);
                if(!isNaN(v)) { totalSum += v; totalCount++; }
            });
        });
        const classAvg = totalCount > 0 ? (totalSum / totalCount).toFixed(1) : '—';
        const progressPercent = (parseFloat(classAvg) / 5) * 100 || 0;

        return `
            <div class="card">
                <h2 class="page-title">МБОУ СОШ «Школа №1» им. А.С. Пушкина</h2>
                
                <div class="controls-row">
                    <label>Предмет:</label>
                    <select onchange="journalSubject=this.value; render();">
                        ${SUBJECTS_LIST.map(s => `<option value="${s}" ${s === journalSubject ? 'selected' : ''}>${s}</option>`).join('')}
                    </select>
                    
                    <label>Дата:</label>
                    <input type="date" value="${journalDate}" onchange="journalDate=this.value; render();">
                    
                    <button class="btn-lottery" onclick="runLottery()">🎲 Лотерея</button>
                    <button class="btn-reset" onclick="if(confirm('Сбросить все оценки?')) { db.marks=[]; saveDB(); render(); }">Сбросить оценки</button>
                </div>

                <div class="dates-row">
                    ${dates.map(d => `
                        <button class="date-btn ${d.iso === journalDate ? 'active' : ''}" onclick="journalDate='${d.iso}'; render();">
                            ${d.label}
                        </button>
                    `).join('')}
                </div>

                <div class="class-avg-bar">
                    <span>Средний балл класса:</span>
                    <div class="progress-bg"><div class="progress-fill" style="width: ${progressPercent}%"></div></div>
                    <span style="color: #0e69d5;">${classAvg}</span>
                </div>
                
                <div class="table-wrapper">
                    <table class="excel-table">
                        <thead>
                            <tr>
                                <th class="student-name">Ученик</th>
                                ${workTypes.map(wt => `<th>${wt}</th>`).join('')}
                                <th class="avg-col">Ср. балл</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${students.map(s => {
                                const sMarks = db.marks.filter(m => m.studentId === s.id && m.subject === journalSubject);
                                let sum = 0, weights = 0;
                                sMarks.forEach(m => {
                                    const v = parseFloat(m.value);
                                    if (!isNaN(v)) { sum += v * (m.weight || 1); weights += (m.weight || 1); }
                                });
                                const studentAvg = weights > 0 ? (sum / weights).toFixed(1) : '—';
                                const isWinner = lotteryStudentId === s.id;
                                const rowClass = isWinner ? 'lottery-highlight' : '';

                                return `
                                <tr class="${rowClass}">
                                    <td class="student-name">${s.name}</td>
                                    ${workTypes.map(wt => {
                                        const mark = db.marks.find(m => m.studentId === s.id && m.subject === journalSubject && m.date === journalDate && m.type === wt);
                                        const val = mark ? mark.value : '';
                                        
                                        let badge = '';
                                        if(mark && mark.weight > 1) {
                                            badge = `<div class="weight-badge" onclick="editWeight(event, '${s.id}', '${journalSubject}', '${journalDate}', '${wt}')">${mark.weight}</div>`;
                                        }

                                        return `
                                            <td style="position:relative;">
                                                ${badge}
                                                <input type="text" class="excel-input" value="${val}" 
                                                       onchange="updateMark('${s.id}', '${journalSubject}', '${journalDate}', '${wt}', this.value)"
                                                       oncontextmenu="editWeight(event, '${s.id}', '${journalSubject}', '${journalDate}', '${wt}')">
                                            </td>
                                        `;
                                    }).join('')}
                                    <td class="avg-col">${studentAvg}</td>
                                </tr>
                            `}).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
        `;
    }

    // --- РАСПИСАНИЕ (УЧИТЕЛЬ) ---
    function renderSchedule() {
        const allLessons = db.lessons.sort((a,b) => { if(a.date !== b.date) return a.date.localeCompare(b.date); return a.time.localeCompare(b.time); });
        return `
            <div class="card">
                <h2 class="page-title">Расписание</h2>
                <form onsubmit="addLesson(event)" style="max-width: 600px;">
                    <div class="form-grid">
                        <div class="field"><label>Дата</label><input type="date" name="date" value="${getToday()}" required></div>
                        <div class="field"><label>Время</label><input type="time" name="time" value="08:10" required></div>
                    </div>
                    <div class="form-grid">
                        <div class="field"><label>Предмет</label><select name="subject" required>${SUBJECTS_LIST.map(s => `<option value="${s}">${s}</option>`).join('')}</select></div>
                        <div class="field"><label>Кабинет</label><input type="text" name="room" value="211"></div>
                    </div>
                    <button type="submit" class="btn-submit">Добавить урок</button>
                </form>
            </div>
            <h3 class="page-title">Список уроков</h3>
            ${allLessons.length ? allLessons.map(l => `
                <div class="card" style="display:flex; justify-content:space-between; align-items:center; padding: 12px 20px;">
                    <div>
                        <div style="font-weight: 600;">${l.subject}</div>
                        <div style="font-size: 13px; color: #66727f;">${l.date} в ${l.time} (каб. ${l.room})</div>
                    </div>
                    <button onclick="deleteLesson('${l.id}')" style="background:none; border:none; color:#ee3f58; font-size:20px; cursor:pointer;">✕</button>
                </div>
            `).join('') : '<div class="empty-state">Расписание пустое</div>'}
        `;
    }

    // --- ДОМАШНЕЕ ЗАДАНИЕ (УЧИТЕЛЬ) ---
    function renderTeacherHW() {
        const allHw = db.homework.sort((a,b) => b.date.localeCompare(a.date));
        return `
            <div class="card">
                <h2 class="page-title">Задать домашнее задание</h2>
                <form onsubmit="addHw(event)" style="max-width: 600px;">
                    <div class="form-grid">
                        <div class="field"><label>Дата</label><input type="date" name="date" value="${getToday()}" required></div>
                        <div class="field"><label>Предмет</label><select name="subject" required>${SUBJECTS_LIST.map(s => `<option value="${s}">${s}</option>`).join('')}</select></div>
                    </div>
                    <div class="field"><label>Задание</label><input type="text" name="text" placeholder="с. 44 №82" required></div>
                    <button type="submit" class="btn-submit">Сохранить</button>
                </form>
            </div>
            <h3 class="page-title">Последние задания</h3>
            ${allHw.length ? allHw.map(h => `
                <div class="card" style="display:flex; justify-content:space-between; align-items:center; padding: 12px 20px;">
                    <div>
                        <div style="font-weight: 600;">${h.subject} <span style="font-size:12px; color:#888;">${h.date}</span></div>
                        <div style="font-size: 14px; color: #66727f;">${h.text}</div>
                    </div>
                    <button onclick="deleteHw('${h.id}')" style="background:none; border:none; color:#ee3f58; font-size:20px; cursor:pointer;">✕</button>
                </div>
            `).join('') : '<div class="empty-state">Заданий нет</div>'}
        `;
    }

    // --- ЛЕНТА (УЧЕНИК) ---
    function renderFeed() {
        const today = getToday();
        const hwToday = db.homework.filter(h => h.date === today);
        const marksToday = db.marks.filter(m => m.date === today && m.studentId === user.id);

        return `
            <div class="card">
                <h2 class="page-title">Лента</h2>
                <div style="margin-bottom: 16px; font-weight: 600; color: #66727f;">${formatDate(today)}</div>
                ${hwToday.length ? `
                <div style="margin-bottom: 24px;">
                    <h3 style="margin-bottom: 12px;">📘 Домашние задания</h3>
                    ${hwToday.map(h => `<div style="margin-bottom: 8px; padding: 12px; background: #f9f9f9; border-radius: 8px;"><strong>${h.subject}</strong>: ${h.text}</div>`).join('')}
                </div>` : ''}
                ${marksToday.length ? `
                <div>
                    <h3 style="margin-bottom: 12px;">⭐ Новые оценки</h3>
                    ${marksToday.map(m => `<div style="margin-bottom: 8px; padding: 12px; background: #f9f9f9; border-radius: 8px;"><strong>${m.subject}</strong>: ${m.value} (${m.type})</div>`).join('')}
                </div>` : ''}
                ${(!hwToday.length && !marksToday.length) ? '<div class="empty-state">На сегодня событий нет</div>' : ''}
            </div>
        `;
    }

    // --- ЗАДАНИЯ (УЧЕНИК) ---
    function renderStudentHW() {
        const hwList = db.homework.filter(h => h.date === selectedDate);
        return `
            <div class="card">
                <h2 class="page-title">Задания на ${selectedDate}</h2>
                <input type="date" value="${selectedDate}" onchange="selectedDate=this.value; render();" style="margin-bottom: 16px; padding: 8px;">
                ${hwList.length ? hwList.map(h => {
                    const isDone = h.doneBy.includes(user.id);
                    return `<div style="display:flex; justify-content:space-between; align-items:center; padding: 12px 0; border-bottom: 1px solid #eee;">
                        <div><strong>${h.subject}</strong>: ${h.text}</div>
                        <button onclick="toggleHomework('${h.id}')" style="background:${isDone?'#e5f0fd':'#fff'}; border:1px solid #ccc; padding:6px 12px; border-radius:6px; cursor:pointer;">${isDone?'Выполнено ✓':'Отметить'}</button>
                    </div>`;
                }).join('') : '<div class="empty-state">Заданий нет</div>'}
            </div>
        `;
    }

    // --- ОЦЕНКИ (УЧЕНИК) ---
    function renderMarks() {
        let marks = db.marks.filter(m => m.studentId === user.id);
        const grouped = {};
        marks.forEach(m => { if (!grouped[m.date]) grouped[m.date] = []; grouped[m.date].push(m); });
        const sortedDates = Object.keys(grouped).sort((a,b) => b.localeCompare(a));

        return `
            <div class="card">
                <h2 class="page-title">Мои оценки</h2>
                ${sortedDates.length ? sortedDates.map(date => `
                    <div style="margin-bottom: 16px;">
                        <div style="font-weight: 600; color: #66727f; margin-bottom: 8px;">${formatDate(date)}</div>
                        ${grouped[date].map(m => `<div style="padding: 8px; background: #f9f9f9; border-radius: 6px; margin-bottom: 4px;"><strong>${m.subject}</strong>: ${m.value} (${m.type})</div>`).join('')}
                    </div>
                `).join('') : '<div class="empty-state">Оценок пока нет</div>'}
            </div>
        `;
    }

    // --- ИТОГОВЫЕ (УЧЕНИК) ---
    function renderFinal() {
        const SUBJECTS_LIST = ['Русский язык', 'Математика', 'Литер. чтение', 'Окруж. мир', 'ИЗО', 'Труд(технология)', 'Физкультура', 'Англ. яз.', 'Музыка'];
        return `
            <div class="card">
                <h2 class="page-title">Итоговые оценки</h2>
                <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px;">
                    ${SUBJECTS_LIST.map(subj => {
                        const marks = db.marks.filter(m => m.studentId === user.id && m.subject === subj);
                        let sum = 0, weights = 0;
                        marks.forEach(m => { const val = parseFloat(m.value); if (!isNaN(val)) { sum += val * (m.weight || 1); weights += (m.weight || 1); } });
                        const final = weights > 0 ? Math.round(sum / weights) : '—';
                        return `<div style="padding: 16px; background: #f9f9f9; border-radius: 8px; text-align: center;">
                            <div style="font-size: 14px; color: #66727f;">${subj}</div>
                            <div style="font-size: 24px; font-weight: 700; color: #0e69d5;">${final}</div>
                        </div>`;
                    }).join('')}
                </div>
            </div>
        `;
    }

    // --- ПРОФИЛЬ ---
    function renderProfile() {
        const isTeacher = user.role === 'teacher' || user.role === 'admin';
        return `
            <div class="card" style="text-align: center; max-width: 600px; margin: 0 auto;">
                <div style="font-size: 64px; margin-bottom: 16px;">${isTeacher ? '👨‍🏫' : '👨‍🎓'}</div>
                <div style="font-size: 24px; font-weight: 700; margin-bottom: 8px;">${user.name}</div>
                <div style="font-size: 16px; color: var(--text-gray); margin-bottom: 24px;">${isTeacher ? 'Учитель' : user.className}</div>
                
                <div class="export-area" style="text-align: left;">
                    <h3>Синхронизация данных</h3>
                    ${isTeacher 
                        ? `<p style="font-size: 13px; color: #66727f; margin-bottom: 12px;">Скачайте базу и отправьте на телефон.</p>
                           <button onclick="exportData()" class="btn-submit" style="background: #0e69d5;">Скачать файл базы</button>`
                        : `<p style="font-size: 13px; color: #66727f; margin-bottom: 12px;">Загрузите файл school_data.json с компьютера.</p>
                           <input type="file" id="import-file" accept=".json" onchange="importData(event)">`
                    }
                </div>

                <button onclick="logout()" class="btn-submit" style="background: #fde8eb; color: #ee3f58; margin-top: 24px;">Выйти из аккаунта</button>
            </div>
        `;
    }

    // --- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ---
    function addLesson(e) {
        e.preventDefault();
        const fd = new FormData(e.target);
        const d = Object.fromEntries(fd.entries());
        db.lessons.push({ id: 'l'+uid(), date: d.date, time: d.time, subject: d.subject, room: d.room });
        saveDB(); render();
    }
    function deleteLesson(id) {
        if(confirm('Удалить урок?')) { db.lessons = db.lessons.filter(x => x.id !== id); saveDB(); render(); }
    }
    function addHw(e) {
        e.preventDefault();
        const fd = new FormData(e.target);
        const d = Object.fromEntries(fd.entries());
        db.homework.push({ id: 'h'+uid(), date: d.date, subject: d.subject, text: d.text, doneBy: [] });
        saveDB(); render();
    }
    function deleteHw(id) {
        if(confirm('Удалить задание?')) { db.homework = db.homework.filter(x => x.id !== id); saveDB(); render(); }
    }

    function runLottery() {
        const students = db.users.filter(u => u.role === 'student');
        if (students.length === 0) return;
        let counter = 0;
        const interval = setInterval(() => {
            const randomIdx = Math.floor(Math.random() * students.length);
            lotteryStudentId = students[randomIdx].id;
            render(); 
            counter++;
            if (counter > 10) {
                clearInterval(interval);
                const finalIdx = Math.floor(Math.random() * students.length);
                lotteryStudentId = students[finalIdx].id;
                render();
                alert(`🎉 Выбран ученик: ${students[finalIdx].name}!`);
                setTimeout(() => { lotteryStudentId = null; render(); }, 3000);
            }
        }, 100);
    }

    function updateMark(studentId, subject, date, type, value) {
        value = value.trim();
        const existing = db.marks.find(m => m.studentId === studentId && m.subject === subject && m.date === date && m.type === type);
        if (existing) {
            if (value === '') db.marks = db.marks.filter(m => m.id !== existing.id);
            else existing.value = value;
        } else if (value !== '') {
            db.marks.push({ id: 'm'+uid(), studentId, subject, date, value, weight: 1, type: type });
        }
        saveDB(); 
    }

    function editWeight(e, studentId, subject, date, type) {
        e.preventDefault(); e.stopPropagation();
        const mark = db.marks.find(m => m.studentId === studentId && m.subject === subject && m.date === date && m.type === type);
        if (!mark) return;
        const w = prompt('Вес оценки (1, 2, 3):', mark.weight || 1);
        if (w && parseInt(w) > 0) { mark.weight = parseInt(w); saveDB(); render(); }
    }

    function toggleHomework(id) {
        const h = db.homework.find(x => x.id === id);
        if (!h) return;
        const idx = h.doneBy.indexOf(user.id);
        if (idx > -1) h.doneBy.splice(idx, 1); else h.doneBy.push(user.id);
        saveDB(); render();
    }

    // Запуск
    render();
</script>
</body>
</html>
